<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050510" />
  <title>Night Dragon Screensaver</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #050510;
      overflow: hidden;
      cursor: none;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: rgba(220, 230, 255, 0.55);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 1.2s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #hint.hide { opacity: 0; }
    #clock {
      position: fixed;
      left: 50%;
      top: 9%;
      transform: translateX(-50%);
      color: rgba(235, 242, 255, 0.82);
      font-weight: 300;
      font-size: clamp(42px, 8vw, 92px);
      letter-spacing: 0.12em;
      pointer-events: none;
      text-shadow: 0 0 40px rgba(120, 170, 255, 0.18), 0 4px 24px rgba(0,0,0,0.55);
      font-variant-numeric: tabular-nums;
    }
    #clock .sec { opacity: 0.38; font-size: 0.42em; letter-spacing: 0.18em; margin-left: 0.2em; }
    #clock .date {
      display: block;
      text-align: center;
      font-size: 0.22em;
      letter-spacing: 0.28em;
      margin-top: 0.35em;
      opacity: 0.55;
      text-transform: uppercase;
    }
    #clock.off { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="clock"></div>
  <div id="hint">Click for fullscreen · C clock · F fullscreen · Space pause</div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: false });
    const clockEl = document.getElementById("clock");
    const hintEl = document.getElementById("hint");

    let W = 0, H = 0, dpr = 1;
    let running = true;
    let showClock = true;
    let t0 = performance.now();
    let last = t0;

    const stars = [];
    const meteors = [];
    const sparks = [];
    const dragons = [];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function seedStars() {
      stars.length = 0;
      const n = Math.floor((W * H) / 2800);
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.78,
          r: Math.random() < 0.08 ? 1.6 + Math.random() * 1.4 : 0.4 + Math.random() * 1.1,
          tw: Math.random() * Math.PI * 2,
          spd: 0.6 + Math.random() * 2.2,
          a: 0.25 + Math.random() * 0.75,
          hue: 210 + Math.random() * 40
        });
      }
    }
    seedStars();
    window.addEventListener("resize", seedStars);

    function spawnMeteor() {
      const fromLeft = Math.random() < 0.55;
      meteors.push({
        x: fromLeft ? -40 : W * (0.2 + Math.random() * 0.8),
        y: Math.random() * H * 0.28,
        vx: fromLeft ? 6 + Math.random() * 5 : -(7 + Math.random() * 6),
        vy: 3.2 + Math.random() * 3.4,
        life: 1,
        decay: 0.008 + Math.random() * 0.01,
        len: 70 + Math.random() * 90
      });
    }

    function makeDragon(kind) {
      const goingRight = Math.random() < 0.5;
      const scale = kind === "near" ? 1.15 + Math.random() * 0.35 : 0.45 + Math.random() * 0.35;
      const y = kind === "near" ? H * (0.38 + Math.random() * 0.22) : H * (0.16 + Math.random() * 0.28);
      return {
        x: goingRight ? -220 : W + 220,
        y,
        dir: goingRight ? 1 : -1,
        scale,
        speed: (kind === "near" ? 0.28 : 0.18) + Math.random() * 0.12,
        flap: Math.random() * Math.PI * 2,
        flapSpd: 2.1 + Math.random() * 0.7,
        hue: kind === "near" ? 18 + Math.random() * 16 : 210 + Math.random() * 30,
        glow: kind === "near" ? 0.55 : 0.28,
        kind
      };
    }

    dragons.push(makeDragon("near"));
    dragons.push(makeDragon("far"));

    function drawSky(now) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#050512");
      g.addColorStop(0.42, "#0a1028");
      g.addColorStop(0.72, "#1a1630");
      g.addColorStop(1, "#2a1a18");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const ag = ctx.createRadialGradient(W * 0.72, H * 0.12, 10, W * 0.72, H * 0.18, W * 0.55);
      ag.addColorStop(0, "rgba(90, 130, 220, 0.10)");
      ag.addColorStop(0.45, "rgba(160, 80, 160, 0.05)");
      ag.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = ag;
      ctx.fillRect(0, 0, W, H);

      const moonX = W * 0.78;
      const moonY = H * 0.16;
      const moonR = Math.min(W, H) * 0.055;
      const halo = ctx.createRadialGradient(moonX, moonY, moonR * 0.4, moonX, moonY, moonR * 6);
      halo.addColorStop(0, "rgba(210, 225, 255, 0.18)");
      halo.addColorStop(0.25, "rgba(160, 190, 255, 0.06)");
      halo.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR * 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e8eefc";
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(5,5,16,0.18)";
      ctx.beginPath();
      ctx.arc(moonX - moonR * 0.28, moonY - moonR * 0.1, moonR * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(moonX + moonR * 0.32, moonY + moonR * 0.22, moonR * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawStars(now) {
      for (const s of stars) {
        const tw = 0.45 + 0.55 * Math.sin(now * 0.001 * s.spd + s.tw);
        ctx.fillStyle = `hsla(${s.hue}, 70%, 88%, ${s.a * tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        if (s.r > 1.5) {
          ctx.strokeStyle = `hsla(${s.hue}, 80%, 90%, ${0.18 * tw})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(s.x - s.r * 3.2, s.y);
          ctx.lineTo(s.x + s.r * 3.2, s.y);
          ctx.moveTo(s.x, s.y - s.r * 3.2);
          ctx.lineTo(s.x, s.y + s.r * 3.2);
          ctx.stroke();
        }
      }
    }

    function drawMeteors() {
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        m.life -= m.decay;
        const ang = Math.atan2(m.vy, m.vx);
        ctx.strokeStyle = `rgba(255,245,230,${Math.max(0, m.life)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - Math.cos(ang) * m.len, m.y - Math.sin(ang) * m.len);
        ctx.stroke();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, m.life)})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        if (m.life <= 0 || m.x < -120 || m.x > W + 120 || m.y > H) meteors.splice(i, 1);
      }
    }

    function drawDragon(d, now) {
      const flap = Math.sin(now * 0.001 * d.flapSpd + d.flap);
      const wing = 26 + flap * 22;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.scale(d.dir * d.scale, d.scale);

      ctx.shadowColor = `hsla(${d.hue}, 90%, 60%, ${d.glow})`;
      ctx.shadowBlur = 18 * d.scale;

      ctx.fillStyle = `hsla(${d.hue}, 35%, 8%, 0.92)`;
      ctx.beginPath();
      ctx.moveTo(-70, 6);
      ctx.quadraticCurveTo(-20, -8, 18, 0);
      ctx.quadraticCurveTo(38, -6, 52, -2);
      ctx.lineTo(62, -10);
      ctx.lineTo(58, 2);
      ctx.lineTo(70, 6);
      ctx.lineTo(56, 8);
      ctx.quadraticCurveTo(30, 14, 8, 10);
      ctx.quadraticCurveTo(-30, 16, -70, 6);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(8, -2);
      ctx.quadraticCurveTo(-6, -wing, -38, -wing * 0.55);
      ctx.quadraticCurveTo(-8, -10, 4, 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.quadraticCurveTo(-18, -wing * 0.55, -46, -wing * 0.28);
      ctx.quadraticCurveTo(-16, -2, -2, 4);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-62, 6);
      ctx.quadraticCurveTo(-78, 2 + flap * 4, -96, 16);
      ctx.quadraticCurveTo(-74, 8, -58, 8);
      ctx.fill();

      ctx.restore();

      if (d.kind === "near" && Math.random() < 0.35) {
        sparks.push({
          x: d.x + d.dir * 58 * d.scale,
          y: d.y - 2 * d.scale,
          vx: d.dir * (1.2 + Math.random()),
          vy: -0.4 + Math.random() * 0.8,
          life: 1,
          hue: d.hue
        });
      }
    }

    function drawSparks() {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02;
        p.life -= 0.02;
        ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${Math.max(0, p.life)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.6 * p.life, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) sparks.splice(i, 1);
      }
    }

    function drawTerrain() {
      ctx.fillStyle = "#07060c";
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.78);
      const peaks = [
        [0.00, 0.78], [0.08, 0.70], [0.16, 0.74], [0.28, 0.62],
        [0.40, 0.71], [0.52, 0.58], [0.64, 0.68], [0.76, 0.60],
        [0.88, 0.69], [1.00, 0.64]
      ];
      for (const [px, py] of peaks) ctx.lineTo(W * px, H * py);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#0c0a12";
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.86);
      ctx.quadraticCurveTo(W * 0.2, H * 0.80, W * 0.38, H * 0.86);
      ctx.quadraticCurveTo(W * 0.58, H * 0.93, W * 0.78, H * 0.84);
      ctx.quadraticCurveTo(W * 0.92, H * 0.80, W, H * 0.85);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }

    function updateClock() {
      if (!showClock) {
        clockEl.classList.add("off");
        return;
      }
      clockEl.classList.remove("off");
      const n = new Date();
      const hh = String(n.getHours()).padStart(2, "0");
      const mm = String(n.getMinutes()).padStart(2, "0");
      const ss = String(n.getSeconds()).padStart(2, "0");
      const date = n.toLocaleDateString(undefined, {
        weekday: "long", month: "short", day: "numeric"
      });
      clockEl.innerHTML = `${hh}:${mm}<span class="sec">${ss}</span><span class="date">${date}</span>`;
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (!running) return;
      const dt = Math.min(40, now - last);
      last = now;

      drawSky(now);
      drawStars(now);
      drawMeteors();

      for (const d of dragons) {
        d.x += d.dir * d.speed * (dt / 16);
        drawDragon(d, now);
        if (d.dir > 0 && d.x > W + 260) Object.assign(d, makeDragon(d.kind));
        if (d.dir < 0 && d.x < -260) Object.assign(d, makeDragon(d.kind));
      }

      drawSparks();
      drawTerrain();
      updateClock();

      if (Math.random() < 0.006) spawnMeteor();
    }
    requestAnimationFrame(loop);

    setTimeout(() => hintEl.classList.add("hide"), 4500);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") toggleFullscreen();
      if (e.key === "c" || e.key === "C") showClock = !showClock;
      if (e.key === " ") { e.preventDefault(); running = !running; }
      if (e.key === "Escape" && document.fullscreenElement) document.exitFullscreen?.();
    });
    canvas.addEventListener("click", toggleFullscreen);
    document.addEventListener("touchend", (e) => {
      if (e.changedTouches.length) toggleFullscreen();
    }, { passive: true });
  </script>
</body>
</html>
